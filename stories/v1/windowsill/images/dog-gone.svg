<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65759b"/>
      <stop offset="0.65" stop-color="#b6b4c6"/>
      <stop offset="1" stop-color="#e6cfbd"/>
    </linearGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8ba0"/>
      <stop offset="0.5" stop-color="#5a5869"/>
      <stop offset="1" stop-color="#3e3d4c"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15131c"/>
      <stop offset="0.6" stop-color="#2b2835"/>
      <stop offset="1" stop-color="#1b1923"/>
    </linearGradient>
    <clipPath id="glass"><rect x="120" y="60" width="880" height="620"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <g id="paw">
      <ellipse cx="0" cy="6" rx="7" ry="6"/>
      <circle cx="-7" cy="-4" r="2.6"/>
      <circle cx="-2.5" cy="-8" r="2.6"/>
      <circle cx="2.5" cy="-8" r="2.6"/>
      <circle cx="7" cy="-4" r="2.6"/>
    </g>
  </defs>

  <g>
  <rect width="1200" height="800" fill="#24212c"/>

  <g clip-path="url(#glass)">
    <rect x="120" y="60" width="880" height="620" fill="url(#sky)"/>
    <path d="M120 250 L360 250 L420 215 L700 215 L760 250 L1000 250 L1000 470 L120 470 Z" fill="#6d697b"/>
    <rect x="200" y="300" width="60" height="70" fill="#7d798c"/>
    <rect x="520" y="290" width="70" height="80" fill="#7d798c"/>
    <rect x="840" y="300" width="60" height="70" fill="#7d798c"/>
    <rect x="120" y="440" width="880" height="30" fill="#5d5a6b"/>
    <!-- 濡れた路面に映る空 -->
    <rect x="120" y="470" width="880" height="210" fill="url(#wet)"/>
    <ellipse cx="600" cy="560" rx="300" ry="30" fill="#d9cfd0" opacity="0.18" filter="url(#soft)"/>
    <!-- 消えた街灯 -->
    <rect x="768" y="300" width="8" height="330" fill="#4a4757"/>
    <path d="M752 296 L792 296 L784 286 L760 286 Z" fill="#524f60"/>
    <rect x="768" y="630" width="8" height="46" fill="#4a4757" opacity="0.25" filter="url(#haze)"/>
    <!-- 並んで残った、小さな足跡がふたつ -->
    <g fill="#2e2c3a" opacity="0.7" filter="url(#haze)">
      <use href="#paw" transform="translate(628 636) rotate(-8)"/>
      <use href="#paw" transform="translate(654 640) rotate(6)"/>
    </g>
  </g>

  <g fill="none" stroke="#1e1c25">
    <rect x="110" y="50" width="900" height="640" stroke-width="20"/>
    <line x1="560" y1="50" x2="560" y2="690" stroke-width="12"/>
  </g>
  <rect x="90" y="690" width="940" height="30" fill="#34303e"/>
  <rect x="90" y="690" width="940" height="4" fill="#4c4758"/>

  <!-- 半分だけ開けたカーテン -->
  <path d="M0 20 C 120 40, 260 50, 440 42 C 450 300, 430 560, 452 800 L 0 800 Z" fill="url(#curtain)"/>
  <g stroke="#100f16" fill="none" opacity="0.7">
    <path d="M110 40 C 124 300, 104 560, 122 800" stroke-width="12"/>
    <path d="M250 46 C 262 300, 240 560, 258 800" stroke-width="10"/>
    <path d="M370 44 C 382 300, 364 560, 380 800" stroke-width="8"/>
  </g>
  <path d="M440 42 C 450 300, 430 560, 452 800" stroke="#6b6680" stroke-width="3" fill="none" opacity="0.5"/>
  </g>

  <rect width="1200" height="800" filter="url(#grain)" opacity="0.07"/>
</svg>
