<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4655"/>
      <stop offset="1" stop-color="#3a3644"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d4450"/>
      <stop offset="1" stop-color="#2c2631"/>
    </linearGradient>
    <radialGradient id="whiteout" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#f6f6f4"/>
      <stop offset="1" stop-color="#dfe0e4"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ede3" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f3ede3" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.8"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <g>
  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect x="0" y="600" width="1200" height="200" fill="url(#floor)"/>
  <g stroke="#241f29" stroke-width="2" opacity="0.6">
    <line x1="0" y1="650" x2="1200" y2="650"/>
    <line x1="0" y1="710" x2="1200" y2="710"/>
  </g>

  <!-- 一面が白い窓 -->
  <rect x="440" y="120" width="360" height="380" fill="url(#whiteout)"/>
  <rect x="420" y="100" width="400" height="420" fill="#f2f1ee" opacity="0.25" filter="url(#soft)"/>
  <g fill="none" stroke="#2d2935">
    <rect x="432" y="112" width="376" height="396" stroke-width="16"/>
    <line x1="620" y1="112" x2="620" y2="508" stroke-width="10"/>
  </g>
  <rect x="410" y="508" width="420" height="18" fill="#2f2a36"/>
  <!-- 床に落ちる朝の光 -->
  <polygon points="440,526 800,526 980,800 300,800" fill="url(#beam)"/>

  <!-- 窓辺の椅子（背をこちらに） -->
  <g filter="url(#edge)" fill="#241f2a">
    <rect x="566" y="420" width="108" height="14"/>
    <rect x="566" y="420" width="10" height="150"/>
    <rect x="664" y="420" width="10" height="150"/>
    <rect x="566" y="520" width="108" height="12"/>
    <rect x="570" y="532" width="8" height="120"/>
    <rect x="662" y="532" width="8" height="120"/>
    <rect x="584" y="440" width="72" height="8" opacity="0.8"/>
    <rect x="584" y="470" width="72" height="8" opacity="0.8"/>
  </g>

  <!-- 澪の本棚 -->
  <g filter="url(#edge)">
    <rect x="80" y="180" width="240" height="440" fill="#2e2834"/>
    <rect x="92" y="192" width="216" height="416" fill="#221d27"/>
    <rect x="92" y="330" width="216" height="10" fill="#2e2834"/>
    <rect x="92" y="470" width="216" height="10" fill="#2e2834"/>
    <g>
      <rect x="100" y="222" width="18" height="108" fill="#6e5c62"/>
      <rect x="120" y="232" width="14" height="98" fill="#5b6478"/>
      <rect x="136" y="214" width="22" height="116" fill="#7a6b58"/>
      <rect x="160" y="228" width="16" height="102" fill="#56615a"/>
      <rect x="178" y="220" width="20" height="110" fill="#6c5f74"/>
      <rect x="226" y="238" width="18" height="92" fill="#7d6655"/>
      <rect x="246" y="226" width="14" height="104" fill="#5d6a7a"/>
      <rect x="100" y="370" width="20" height="100" fill="#5b6478"/>
      <rect x="122" y="380" width="16" height="90" fill="#6e5c62"/>
      <rect x="140" y="364" width="18" height="106" fill="#6f7560"/>
      <rect x="200" y="376" width="22" height="94" fill="#7a6b58"/>
      <rect x="224" y="368" width="16" height="102" fill="#6c5f74"/>
      <rect x="100" y="512" width="60" height="96" fill="#4b4452"/>
      <rect x="170" y="520" width="18" height="88" fill="#7d6655"/>
    </g>
  </g>

  <!-- 十年前の日付のままのカレンダー。最後の月の一日にだけ小さな丸 -->
  <g filter="url(#edge)">
    <rect x="900" y="200" width="160" height="210" fill="#d6d0c6"/>
    <rect x="900" y="200" width="160" height="40" fill="#8c8190"/>
    <g fill="#9d968d">
      <rect x="914" y="256" width="14" height="10"/><rect x="934" y="256" width="14" height="10"/><rect x="954" y="256" width="14" height="10"/><rect x="974" y="256" width="14" height="10"/><rect x="994" y="256" width="14" height="10"/><rect x="1014" y="256" width="14" height="10"/><rect x="1034" y="256" width="14" height="10"/>
      <rect x="914" y="282" width="14" height="10"/><rect x="934" y="282" width="14" height="10"/><rect x="954" y="282" width="14" height="10"/><rect x="974" y="282" width="14" height="10"/><rect x="994" y="282" width="14" height="10"/><rect x="1014" y="282" width="14" height="10"/><rect x="1034" y="282" width="14" height="10"/>
      <rect x="914" y="308" width="14" height="10"/><rect x="934" y="308" width="14" height="10"/><rect x="954" y="308" width="14" height="10"/><rect x="974" y="308" width="14" height="10"/><rect x="994" y="308" width="14" height="10"/><rect x="1014" y="308" width="14" height="10"/><rect x="1034" y="308" width="14" height="10"/>
      <rect x="914" y="334" width="14" height="10"/><rect x="934" y="334" width="14" height="10"/><rect x="954" y="334" width="14" height="10"/><rect x="974" y="334" width="14" height="10"/><rect x="994" y="334" width="14" height="10"/><rect x="1014" y="334" width="14" height="10"/><rect x="1034" y="334" width="14" height="10"/>
      <rect x="914" y="360" width="14" height="10"/><rect x="934" y="360" width="14" height="10"/><rect x="954" y="360" width="14" height="10"/>
    </g>
    <circle cx="961" cy="287" r="11" fill="none" stroke="#a4524a" stroke-width="2.5"/>
    <rect x="976" y="194" width="8" height="12" fill="#3a3440"/>
  </g>
  </g>

  <rect width="1200" height="800" filter="url(#grain)" opacity="0.07"/>
</svg>
