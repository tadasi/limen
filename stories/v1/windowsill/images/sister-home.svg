<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c8fb8"/>
      <stop offset="0.45" stop-color="#d9c3c2"/>
      <stop offset="0.8" stop-color="#ffd9a8"/>
      <stop offset="1" stop-color="#ffe9c4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.12" stop-color="#fff0d2" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffd9a0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffc98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c9a8"/>
      <stop offset="0.35" stop-color="#9f8f98"/>
      <stop offset="1" stop-color="#4a4452"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3647"/>
      <stop offset="1" stop-color="#8a7a80"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#3a3647"/>
      <stop offset="1" stop-color="#8a7a80"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0d4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff0d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="rays" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="figure" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="6" xChannelSelector="R" yChannelSelector="G" result="moved"/>
      <feGaussianBlur in="moved" stdDeviation="1.6"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <g>
    <rect width="1200" height="800" fill="url(#sky)"/>
    <!-- 雲の名残 -->
    <path d="M120 140 C 220 110, 360 120, 460 150 C 380 160, 240 170, 120 140 Z" fill="#f3d9cf" opacity="0.5"/>
    <path d="M760 110 C 860 90, 1000 100, 1100 128 C 1000 140, 860 138, 760 110 Z" fill="#f3d9cf" opacity="0.45"/>

    <!-- 路地（一点透視。消失点 600,470） -->
    <polygon points="0,800 1200,800 650,478 550,478" fill="url(#road)"/>
    <polygon points="0,90 250,210 430,330 555,420 555,480 0,800" fill="url(#wallL)"/>
    <path d="M0 90 C 90 70, 170 60, 250 150 L 250 210 Z" fill="#2c2937"/>
    <path d="M250 210 C 320 210, 380 250, 430 290 L 430 330 Z" fill="#33303f"/>
    <polygon points="1200,120 950,230 780,340 645,420 645,480 1200,800" fill="url(#wallR)"/>
    <path d="M1200 120 C 1110 90, 1020 90, 950 170 L 950 230 Z" fill="#2c2937"/>

    <!-- 灯りのともりはじめた窓 -->
    <g fill="#ffd79a">
      <path d="M78 262 C 120 270, 160 282, 168 300 L 168 400 C 130 396, 96 390, 78 384 Z" opacity="0.55"/>
      <path d="M304 346 C 330 352, 356 362, 364 372 L 364 440 C 340 438, 318 436, 304 432 Z" opacity="0.4"/>
      <path d="M1122 280 C 1080 290, 1044 302, 1034 318 L 1034 418 C 1070 414, 1104 408, 1122 402 Z" opacity="0.5"/>
    </g>
    <!-- 灯りの消えた街灯 -->
    <path d="M238 250 C 236 400, 238 540, 240 670" stroke="#3d3947" stroke-width="8" fill="none"/>

    <!-- 朝日と光の筋 -->
    <circle cx="600" cy="462" r="230" fill="url(#sun)"/>
    <g fill="url(#ray)" filter="url(#rays)">
      <polygon points="590,470 610,470 820,800 700,800"/>
      <polygon points="590,470 610,470 520,800 400,800"/>
      <polygon points="590,470 610,470 1060,800 960,800"/>
      <polygon points="590,470 610,470 220,800 120,800"/>
    </g>
    <!-- 朝の鳥 -->
    <g stroke="#6b5d6b" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M720 250 q 10 -8 20 0 q 10 -8 20 0"/>
      <path d="M770 220 q 8 -6 16 0 q 8 -6 16 0"/>
    </g>
  </g>

  <!-- 手をつないで朝日のほうへ歩いていく二人（逆光でぼんやりした後ろ姿） -->
  <path d="M520 650 C 500 700, 470 760, 440 800 L 520 800 C 536 760, 548 700, 556 650 Z" fill="#3a3040" opacity="0.28" filter="url(#soft)"/>
  <path d="M628 660 C 636 710, 644 760, 650 800 L 700 800 C 690 760, 670 710, 652 660 Z" fill="#3a3040" opacity="0.24" filter="url(#soft)"/>
  <g filter="url(#figure)">
    <!-- 姉 -->
    <path d="M532 580 C 530 610, 530 630, 532 652 L 546 652 C 548 630, 548 610, 548 584 Z" fill="#3b3344"/>
    <path d="M556 584 C 556 610, 558 630, 560 652 L 574 652 C 574 630, 574 610, 572 580 Z" fill="#3b3344"/>
    <path d="M524 476 C 530 460, 578 460, 584 476 C 592 510, 594 560, 590 590 C 566 598, 540 598, 516 590 C 512 560, 516 510, 524 476 Z" fill="#524659"/>
    <path d="M532 444 C 530 418, 578 418, 576 444 C 578 462, 572 476, 554 478 C 536 476, 530 462, 532 444 Z" fill="#2e2635"/>
    <path d="M584 500 C 600 530, 610 552, 614 568" stroke="#524659" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- 白っぽい寝間着の子ども -->
    <path d="M620 612 C 618 630, 618 646, 620 662 L 630 662 C 632 646, 632 630, 630 614 Z" fill="#cbbfb4"/>
    <path d="M636 614 C 636 630, 638 646, 640 662 L 650 662 C 650 646, 650 630, 646 612 Z" fill="#cbbfb4"/>
    <path d="M612 560 C 616 550, 648 550, 652 560 C 656 584, 656 604, 652 618 C 636 624, 626 624, 610 618 C 606 604, 608 584, 612 560 Z" fill="#efe6da"/>
    <path d="M616 568 C 614 574, 614 578, 614 572" stroke="#efe6da" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="632" cy="538" r="17" fill="#3a3040"/>
  </g>
  <!-- 逆光の縁 -->
  <g fill="none" stroke="#ffe4bc" stroke-width="2.5" opacity="0.55" filter="url(#figure)">
    <path d="M532 444 C 530 418, 578 418, 576 444"/>
    <path d="M524 476 C 530 460, 578 460, 584 476"/>
    <path d="M616 530 C 620 518, 644 518, 648 530"/>
    <path d="M612 560 C 616 550, 648 550, 652 560"/>
  </g>

  <rect width="1200" height="800" filter="url(#grain)" opacity="0.06"/>
</svg>
