<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080d28"/>
      <stop offset="0.55" stop-color="#162048"/>
      <stop offset="1" stop-color="#222b52"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dfe4ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#dfe4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2b0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffcf8a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd79c" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffd79c" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd79c" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#ffd79c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffd79c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0b12"/>
      <stop offset="0.5" stop-color="#1a1822"/>
      <stop offset="1" stop-color="#0e0d14"/>
    </linearGradient>
    <clipPath id="glass"><rect x="200" y="80" width="800" height="650"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="blur-shape" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <g>
  <!-- 部屋の暗がり -->
  <rect width="1200" height="800" fill="#07070b"/>

  <g clip-path="url(#glass)">
    <rect x="200" y="80" width="800" height="650" fill="url(#sky)"/>
    <g fill="#eef0ff" filter="url(#haze)">
      <circle cx="300" cy="140" r="1.6" opacity="0.7"/>
      <circle cx="420" cy="110" r="1.2" opacity="0.5"/>
      <circle cx="560" cy="170" r="1.4" opacity="0.6"/>
      <circle cx="690" cy="120" r="1.1" opacity="0.5"/>
      <circle cx="960" cy="250" r="1.3" opacity="0.5"/>
      <circle cx="250" cy="230" r="1" opacity="0.4"/>
    </g>
    <!-- 月 -->
    <circle cx="840" cy="175" r="120" fill="url(#moonGlow)"/>
    <circle cx="840" cy="175" r="30" fill="#f2f1e8"/>
    <circle cx="828" cy="168" r="6" fill="#dcdad0" opacity="0.6"/>

    <!-- 向かいの家並み -->
    <path d="M200 360 L250 320 L300 360 L300 330 L380 280 L460 330 L460 300 L520 270 L580 300 L580 350 L660 300 L740 350 L740 320 L820 285 L900 320 L900 350 L960 315 L1000 340 L1000 600 L200 600 Z" fill="#0c0e1a"/>
    <g fill="#141729">
      <rect x="330" y="380" width="36" height="46"/>
      <rect x="400" y="380" width="36" height="46"/>
      <rect x="610" y="390" width="40" height="46"/>
      <rect x="690" y="390" width="40" height="46"/>
      <rect x="930" y="400" width="34" height="44"/>
    </g>
    <rect x="800" y="385" width="38" height="46" fill="#e9b872" opacity="0.55"/>
    <rect x="800" y="385" width="38" height="46" fill="#e9b872" opacity="0.4" filter="url(#soft)"/>

    <!-- 塀と路地 -->
    <rect x="200" y="560" width="800" height="40" fill="#101320"/>
    <rect x="200" y="600" width="800" height="130" fill="#0f111a"/>

    <!-- 街灯 -->
    <polygon points="418,352 446,352 590,672 274,672" fill="url(#cone)"/>
    <ellipse cx="432" cy="664" rx="190" ry="46" fill="url(#pool)"/>
    <rect x="428" y="352" width="8" height="318" fill="#1b1e2b"/>
    <path d="M410 346 L454 346 L446 336 L418 336 Z" fill="#23263a"/>
    <circle cx="432" cy="352" r="70" fill="url(#lampGlow)"/>

    <!-- 白く小さなもの -->
    <ellipse cx="474" cy="668" rx="44" ry="8" fill="#050508" opacity="0.5" filter="url(#haze)"/>
    <path d="M444 666 C 440 640, 454 620, 474 619 C 496 619, 508 640, 504 666 Z" fill="#efebe0" filter="url(#blur-shape)"/>
    <path d="M452 664 C 452 646, 462 632, 474 632" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4" filter="url(#haze)"/>
  </g>

  <!-- 窓枠（引き違い窓。右の障子を細く開けている） -->
  <g fill="none" stroke="#1a1920">
    <rect x="190" y="70" width="820" height="670" stroke-width="20"/>
    <line x1="590" y1="70" x2="590" y2="740" stroke-width="12"/>
    <line x1="612" y1="70" x2="612" y2="740" stroke-width="12"/>
  </g>
  <rect x="596" y="80" width="10" height="650" fill="#8fa0d6" opacity="0.08"/>
  <rect x="170" y="740" width="860" height="28" fill="#121117"/>
  <rect x="170" y="740" width="860" height="4" fill="#2a2833"/>

  <!-- カーテン -->
  <path d="M60 40 C 120 60, 150 70, 250 60 L 240 790 C 170 780, 110 790, 60 800 Z" fill="url(#curtain)"/>
  <path d="M120 60 C 130 300, 115 560, 130 790" stroke="#0a0910" stroke-width="10" fill="none" opacity="0.7"/>
  <path d="M185 64 C 195 320, 180 560, 192 786" stroke="#0a0910" stroke-width="8" fill="none" opacity="0.6"/>
  </g>

  <rect width="1200" height="800" filter="url(#grain)" opacity="0.08"/>
</svg>
