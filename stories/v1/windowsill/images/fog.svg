<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d122e"/>
      <stop offset="1" stop-color="#2a3150"/>
    </linearGradient>
    <radialGradient id="lampHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe4b4" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#f4d4a4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c9c4c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dfe4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#dfe4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fogRise" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c3c6d2" stop-opacity="0.78"/>
      <stop offset="0.35" stop-color="#a9adbd" stop-opacity="0.42"/>
      <stop offset="0.7" stop-color="#8e93a8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8e93a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="condense" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.55" stop-color="#d8dbe4" stop-opacity="0"/>
      <stop offset="1" stop-color="#d8dbe4" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="glass"><rect x="200" y="80" width="800" height="650"/></clipPath>
    <linearGradient id="mistFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="mistMask"><rect x="200" y="80" width="800" height="650" fill="url(#mistFade)"/></mask>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="mist" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0025 0.008" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.82  0 0 0 0 0.83  0 0 0 0 0.88  0 0 0 1.1 -0.3"/>
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <g>
  <rect width="1200" height="800" fill="#07070b"/>

  <g clip-path="url(#glass)">
    <rect x="200" y="80" width="800" height="650" fill="url(#sky)"/>
    <circle cx="840" cy="175" r="110" fill="url(#moonGlow)"/>
    <circle cx="840" cy="175" r="28" fill="#dcdbd4" opacity="0.7" filter="url(#soft)"/>

    <!-- 溶けていく家並み -->
    <path d="M200 360 L250 320 L300 360 L300 330 L380 280 L460 330 L460 300 L520 270 L580 300 L580 350 L660 300 L740 350 L740 320 L820 285 L900 320 L900 350 L960 315 L1000 340 L1000 600 L200 600 Z" fill="#11142a" opacity="0.85"/>
    <rect x="800" y="385" width="38" height="46" fill="#e9b872" opacity="0.3" filter="url(#soft)"/>
    <rect x="200" y="600" width="800" height="130" fill="#1a1d2a"/>

    <!-- にじむ街灯 -->
    <rect x="428" y="352" width="8" height="318" fill="#2a2d3a" opacity="0.6"/>
    <circle cx="432" cy="352" r="150" fill="url(#lampHalo)"/>
    <circle cx="432" cy="352" r="10" fill="#fff0cf" opacity="0.8" filter="url(#soft)"/>

    <!-- 霧 -->
    <rect x="200" y="80" width="800" height="650" fill="url(#fogRise)"/>
    <g mask="url(#mistMask)">
      <rect x="200" y="80" width="800" height="650" filter="url(#mist)" opacity="0.6"/>
    </g>

    <!-- 硝子の縁から曇っていく -->
    <rect x="200" y="80" width="800" height="650" fill="url(#condense)"/>
  </g>

  <!-- 窓枠 -->
  <g fill="none" stroke="#1a1920">
    <rect x="190" y="70" width="820" height="670" stroke-width="20"/>
    <line x1="590" y1="70" x2="590" y2="740" stroke-width="12"/>
    <line x1="612" y1="70" x2="612" y2="740" stroke-width="12"/>
  </g>
  <!-- 細く開いた隙間から入り込む霧 -->
  <rect x="596" y="80" width="10" height="650" fill="#d7dae3" opacity="0.35"/>
  <path d="M606 520 C 660 540, 700 600, 760 620 C 700 640, 650 620, 606 600 Z" fill="#cfd2dc" opacity="0.18" filter="url(#soft)"/>
  <rect x="170" y="740" width="860" height="28" fill="#121117"/>
  <rect x="170" y="740" width="860" height="4" fill="#2a2833"/>
  </g>

  <rect width="1200" height="800" filter="url(#grain)" opacity="0.08"/>
</svg>
