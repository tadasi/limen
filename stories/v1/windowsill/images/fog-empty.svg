<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- 冷たく色の抜けた朝 -->
    <linearGradient id="backWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c5358"/>
      <stop offset="1" stop-color="#3b4145"/>
    </linearGradient>
    <linearGradient id="sideWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2326"/>
      <stop offset="1" stop-color="#3a4044"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5053"/>
      <stop offset="1" stop-color="#23272a"/>
    </linearGradient>
    <radialGradient id="void" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#f4f6f5"/>
      <stop offset="1" stop-color="#cfd6d6"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eeee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e9eeee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.62" cy="0.45" r="0.8">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="mist" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.02" numOctaves="3" seed="12" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.92  0 0 0 0 0.92  0 0 0 1.6 -0.55"/>
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="ghost" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="3" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="8" xChannelSelector="R" yChannelSelector="G" result="moved"/>
      <feGaussianBlur in="moved" stdDeviation="1.8"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="floorClip"><polygon points="360,560 1200,560 1200,800 0,800"/></clipPath>
  </defs>

  <g>
    <!-- 部屋の角を斜めから見る -->
    <polygon points="0,0 360,90 360,560 0,800" fill="url(#sideWall)"/>
    <polygon points="360,90 1200,90 1200,560 360,560" fill="url(#backWall)"/>
    <rect x="360" y="0" width="840" height="90" fill="#2e3336"/>
    <polygon points="0,0 360,0 360,90" fill="#24282b"/>
    <polygon points="360,560 1200,560 1200,800 0,800" fill="url(#floor)"/>

    <!-- 開け放たれた窓。外には何もない、白い虚空 -->
    <rect x="820" y="170" width="300" height="300" fill="url(#void)"/>
    <g fill="none" stroke="#262a2e">
      <rect x="812" y="162" width="316" height="316" stroke-width="14"/>
    </g>
    <rect x="1060" y="170" width="60" height="300" fill="#9aa3a5" opacity="0.35"/>
    <rect x="800" y="478" width="340" height="16" fill="#2e3336"/>
    <polygon points="820,470 1120,470 900,800 380,800" fill="url(#beam)"/>

    <!-- 空になった本棚 -->
    <polygon points="80,210 220,240 220,640 80,700" fill="#262a2e"/>
    <polygon points="92,228 208,252 208,628 92,684" fill="#15181b"/>
    <polygon points="92,380 208,392 208,400 92,390" fill="#262a2e"/>
    <polygon points="92,530 208,530 208,538 92,540" fill="#262a2e"/>

    <!-- 窓辺の椅子。誰も座っていない -->
    <g fill="#1c1f22">
      <rect x="880" y="520" width="96" height="12"/>
      <rect x="880" y="430" width="10" height="100"/>
      <rect x="966" y="430" width="10" height="100"/>
      <rect x="880" y="430" width="96" height="10"/>
      <rect x="884" y="532" width="8" height="110"/>
      <rect x="964" y="532" width="8" height="110"/>
    </g>
    <path d="M884 642 C 820 690, 740 740, 640 800" stroke="#15181b" stroke-width="10" fill="none" opacity="0.5"/>

    <!-- 額やカレンダーを外した跡 -->
    <g fill="#5d6468">
      <rect x="450" y="190" width="130" height="160"/>
      <rect x="620" y="220" width="90" height="70"/>
      <rect x="630" y="320" width="70" height="90"/>
    </g>
    <g fill="#23272a">
      <circle cx="515" cy="186" r="3"/>
      <circle cx="665" cy="216" r="3"/>
      <circle cx="665" cy="316" r="3"/>
    </g>
  </g>

  <!-- 額の跡に、消えかけた二人の輪郭だけが残っている -->
  <g filter="url(#ghost)" fill="#7b8286" opacity="0.8">
    <path d="M478 340 C 480 300, 500 286, 506 282 C 494 274, 492 252, 506 244 C 520 238, 532 252, 526 270 C 522 280, 530 290, 538 300 C 546 312, 548 330, 548 340 Z"/>
    <path d="M536 340 C 538 312, 548 300, 556 294 C 548 288, 548 272, 558 266 C 568 262, 578 272, 574 286 C 572 294, 578 302, 584 312 C 588 322, 588 334, 586 340 Z"/>
  </g>

  <!-- 床を這い、部屋の奥から迫ってくる霧 -->
  <g clip-path="url(#floorClip)">
    <rect x="0" y="520" width="1200" height="300" filter="url(#mist)" opacity="0.75"/>
  </g>
  <path d="M1120 470 C 1080 520, 1000 540, 900 560 C 980 580, 1060 560, 1120 520 Z" fill="#e5eaea" opacity="0.25" filter="url(#soft)"/>

  <rect width="1200" height="800" fill="url(#vignette)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.1"/>
</svg>
