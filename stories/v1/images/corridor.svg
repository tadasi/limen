<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="vanish" cx="0.5" cy="0.47" r="0.55">
      <stop offset="0" stop-color="#d8cdb2" stop-opacity="0.9"/>
      <stop offset="0.12" stop-color="#8a7f6c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0a090c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2620"/>
      <stop offset="1" stop-color="#0c0b0d"/>
    </linearGradient>
    <linearGradient id="ceil" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#211e1a"/>
      <stop offset="1" stop-color="#09080b"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e0d10"/>
      <stop offset="1" stop-color="#2c2821"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0e0d10"/>
      <stop offset="1" stop-color="#2c2821"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="haze" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1200" height="800" fill="#0a090c"/>
  <!-- 消失点 (600, 375) に向かう一点透視 -->
  <polygon points="0,0 1200,0 640,350 560,350" fill="url(#ceil)"/>
  <polygon points="0,800 1200,800 640,400 560,400" fill="url(#floor)"/>
  <polygon points="0,0 560,350 560,400 0,800" fill="url(#wallL)"/>
  <polygon points="1200,0 640,350 640,400 1200,800" fill="url(#wallR)"/>
  <rect x="560" y="350" width="80" height="50" fill="#cbbf9f" opacity="0.8" filter="url(#soft)"/>

  <!-- 左の扉 -->
  <g fill="#3a3329" stroke="#5a5040" stroke-width="2" filter="url(#haze)">
    <polygon points="80,170 250,275 250,640 80,735"/>
    <polygon points="340,318 420,367 420,531 340,575"/>
    <polygon points="470,389 506,411 506,478 470,496"/>
    <polygon points="527,425 542,434 542,461 527,468"/>
  </g>
  <!-- 右の扉 -->
  <g fill="#3a3329" stroke="#5a5040" stroke-width="2" filter="url(#haze)">
    <polygon points="1120,170 950,275 950,640 1120,735"/>
    <polygon points="860,318 780,367 780,531 860,575"/>
    <polygon points="730,389 694,411 694,478 730,496"/>
    <polygon points="673,425 658,434 658,461 673,468"/>
  </g>
  <!-- 声のする扉：隙間から光 -->
  <polygon points="950,275 950,640 962,634 962,282" fill="#f2dfb4" opacity="0.75" filter="url(#soft)"/>
  <polygon points="950,640 1060,760 1000,780 940,650" fill="#f2dfb4" opacity="0.08" filter="url(#soft)"/>
  <!-- ノブ -->
  <g fill="#b9a67c" opacity="0.8">
    <circle cx="225" cy="470" r="7"/>
    <circle cx="975" cy="470" r="7"/>
    <circle cx="405" cy="452" r="3.5"/>
    <circle cx="795" cy="452" r="3.5"/>
  </g>

  <rect width="1200" height="800" fill="url(#vanish)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.09"/>
</svg>
