<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c14"/>
      <stop offset="1" stop-color="#11131f"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2442"/>
      <stop offset="0.6" stop-color="#2d3a66"/>
      <stop offset="1" stop-color="#4a5b8c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18203a"/>
      <stop offset="1" stop-color="#070810"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5b8c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1c2442" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="ripple" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.06" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="22"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#room)"/>

  <!-- 戸口の光 -->
  <rect x="480" y="120" width="240" height="410" fill="#6d7fb3" opacity="0.35" filter="url(#soft)"/>
  <rect x="500" y="140" width="200" height="390" fill="url(#door)"/>
  <g fill="#e6e9ff" filter="url(#haze)">
    <circle cx="545" cy="200" r="2.4" opacity="0.9"/>
    <circle cx="610" cy="175" r="1.8" opacity="0.7"/>
    <circle cx="660" cy="240" r="2.8" opacity="0.8"/>
    <circle cx="570" cy="300" r="1.6" opacity="0.6"/>
    <circle cx="640" cy="330" r="2" opacity="0.7"/>
  </g>

  <!-- 水面 -->
  <rect x="0" y="530" width="1200" height="270" fill="url(#water)"/>
  <g filter="url(#ripple)">
    <rect x="500" y="532" width="200" height="260" fill="url(#reflect)"/>
    <g fill="#dfe5ff">
      <circle cx="545" cy="862" r="2.2" opacity="0.5" transform="translate(0 -300)"/>
      <circle cx="660" cy="820" r="2.6" opacity="0.5" transform="translate(0 -170)"/>
      <circle cx="640" cy="730" r="1.8" opacity="0.4"/>
      <circle cx="300" cy="640" r="1.6" opacity="0.35"/>
      <circle cx="880" cy="690" r="2" opacity="0.4"/>
      <circle cx="980" cy="610" r="1.4" opacity="0.3"/>
      <circle cx="180" cy="720" r="1.8" opacity="0.3"/>
    </g>
  </g>
  <rect x="0" y="526" width="1200" height="8" fill="#8a9bd0" opacity="0.18" filter="url(#haze)"/>

  <rect width="1200" height="800" filter="url(#grain)" opacity="0.08"/>
</svg>
