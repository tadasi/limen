<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>limen</title>
  <meta name="description" content="夢と現実の敷居をまたぐ、選択式の物語。">
  <meta name="theme-color" content="#07070b">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!-- SNS で URL を共有したときのカード。X などは相対パスを読めないので、公開先の絶対 URL で書く -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="limen">
  <meta property="og:title" content="limen">
  <meta property="og:description" content="夢と現実の敷居をまたぐ、選択式の物語。">
  <meta property="og:url" content="https://tadasi.github.io/limen/">
  <meta property="og:image" content="https://tadasi.github.io/limen/assets/images/ogp.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="二階の窓から見下ろす、月明かりの夜の路地">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="mark">
    <a class="mark-title" href="#/">limen</a>
    <p class="mark-sub" id="mark-sub"></p>
  </header>

  <div class="sound">
    <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false" aria-label="音楽" title="音楽を流す">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
        <g class="sound-waves">
          <path d="M15.5 9.2a4 4 0 0 1 0 5.6"/>
          <path d="M18 6.8a7.5 7.5 0 0 1 0 10.4"/>
        </g>
        <g class="sound-muted">
          <path d="M16 9.5l5 5"/>
          <path d="M21 9.5l-5 5"/>
        </g>
      </svg>
    </button>
    <div class="sound-panel">
      <input class="sound-volume" id="sound-volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="音量">
    </div>
  </div>

  <main class="stage" id="stage">
    <figure class="illustration fx" id="illustration">
      <img id="illustration-image" alt="">
    </figure>

    <section class="narrative" id="narrative" aria-live="polite"></section>

    <nav class="choices" id="choices" aria-label="選択肢" inert></nav>
  </main>

  <noscript><p class="noscript">この物語の表示には JavaScript が必要です。</p></noscript>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/ambient.js"></script>
</body>
</html>
