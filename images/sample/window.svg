<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c8d6"/>
      <stop offset="1" stop-color="#e3dccb"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#1c2140"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pane"><rect x="330" y="120" width="540" height="520"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1200" height="800" fill="#0a0a0f"/>
  <rect x="300" y="90" width="600" height="580" fill="#8791a8" opacity="0.18" filter="url(#soft)"/>

  <g clip-path="url(#pane)">
    <!-- 昼と夜の縞 -->
    <rect x="330" y="120" width="110" height="520" fill="url(#day)"/>
    <rect x="440" y="120" width="110" height="520" fill="url(#night)"/>
    <rect x="550" y="120" width="110" height="520" fill="url(#day)"/>
    <rect x="660" y="120" width="110" height="520" fill="url(#night)"/>
    <rect x="770" y="120" width="100" height="520" fill="url(#day)"/>
    <g filter="url(#haze)">
      <rect x="438" y="120" width="4" height="520" fill="#6e7596" opacity="0.6"/>
      <rect x="548" y="120" width="4" height="520" fill="#6e7596" opacity="0.6"/>
      <rect x="658" y="120" width="4" height="520" fill="#6e7596" opacity="0.6"/>
      <rect x="768" y="120" width="4" height="520" fill="#6e7596" opacity="0.6"/>
    </g>

    <!-- 洗濯物（昼） -->
    <g stroke="#6b6a66" stroke-width="1.5" opacity="0.7">
      <line x1="330" y1="330" x2="440" y2="318"/>
      <line x1="550" y1="310" x2="660" y2="300"/>
      <line x1="770" y1="296" x2="870" y2="290"/>
    </g>
    <g fill="#fbf7ee" opacity="0.9">
      <path d="M356 327 l30 -3 l-2 44 l-26 2 z"/>
      <path d="M572 308 l24 -2 l3 36 l-24 3 z"/>
      <path d="M612 305 l30 -3 l-4 52 l-24 2 z"/>
      <path d="M800 294 l28 -2 l-1 40 l-26 1 z"/>
    </g>

    <!-- 街灯（夜） -->
    <g>
      <rect x="494" y="360" width="3" height="280" fill="#2b3150"/>
      <circle cx="495" cy="356" r="48" fill="url(#lamp)"/>
      <rect x="714" y="400" width="3" height="240" fill="#2b3150"/>
      <circle cx="715" cy="396" r="44" fill="url(#lamp)"/>
    </g>
    <!-- 屋根の稜線 -->
    <path d="M330 560 L400 520 L470 560 L520 540 L600 575 L680 530 L760 565 L830 525 L870 545 L870 640 L330 640 Z" fill="#1a1a22" opacity="0.55"/>

    <!-- 境目を渡る鳥：昼側は白、夜側は黒 -->
    <g transform="translate(548 222)">
      <clipPath id="birdDay"><rect x="-60" y="-40" width="60" height="80"/></clipPath>
      <clipPath id="birdNight"><rect x="0" y="-40" width="60" height="80"/></clipPath>
      <path clip-path="url(#birdDay)" d="M-46 6 C -30 -18, -12 -14, 0 2 C 12 -14, 30 -18, 46 6 C 30 -4, 12 -2, 0 12 C -12 -2, -30 -4, -46 6 Z" fill="#11131c"/>
      <path clip-path="url(#birdNight)" d="M-46 6 C -30 -18, -12 -14, 0 2 C 12 -14, 30 -18, 46 6 C 30 -4, 12 -2, 0 12 C -12 -2, -30 -4, -46 6 Z" fill="#f4f1e8"/>
    </g>
  </g>

  <!-- 窓枠 -->
  <g fill="none" stroke="#1c1b20" stroke-width="18">
    <rect x="330" y="120" width="540" height="520"/>
    <line x1="600" y1="120" x2="600" y2="640" stroke-width="10"/>
    <line x1="330" y1="380" x2="870" y2="380" stroke-width="10"/>
  </g>
  <rect x="300" y="648" width="600" height="22" fill="#15141a"/>

  <rect width="1200" height="800" filter="url(#grain)" opacity="0.08"/>
</svg>
