<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a33"/>
      <stop offset="0.55" stop-color="#5b5f86"/>
      <stop offset="0.85" stop-color="#c9a6a0"/>
      <stop offset="1" stop-color="#ecc9a8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8aa6"/>
      <stop offset="1" stop-color="#2a2f4a"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d6272"/>
      <stop offset="1" stop-color="#2a2530"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1200" height="430" fill="url(#sky)"/>
  <ellipse cx="760" cy="440" rx="260" ry="60" fill="#ffe0b8" opacity="0.5" filter="url(#soft)"/>
  <g fill="#f3efe6" opacity="0.6" filter="url(#haze)">
    <circle cx="210" cy="90" r="1.8"/>
    <circle cx="380" cy="150" r="1.4"/>
    <circle cx="930" cy="70" r="1.6"/>
    <circle cx="1080" cy="160" r="1.2"/>
  </g>

  <!-- 海 -->
  <rect x="0" y="430" width="1200" height="170" fill="url(#sea)"/>
  <g stroke="#e8d6c8" stroke-linecap="round" fill="none" filter="url(#haze)">
    <path d="M560 452 H960" stroke-width="3" opacity="0.5"/>
    <path d="M640 478 H880" stroke-width="2" opacity="0.35"/>
    <path d="M100 520 C 300 505, 600 530, 1100 510" stroke-width="2" opacity="0.2"/>
  </g>

  <!-- 波打ち際と砂浜 -->
  <path d="M0 600 C 240 575, 520 610, 760 590 C 960 574, 1100 600, 1200 588 L1200 800 L0 800 Z" fill="url(#sand)"/>
  <path d="M0 600 C 240 575, 520 610, 760 590 C 960 574, 1100 600, 1200 588" fill="none" stroke="#efe3da" stroke-width="3" opacity="0.45" filter="url(#haze)"/>
  <path d="M0 612 C 260 592, 520 624, 780 604 C 980 590, 1100 612, 1200 602 L1200 632 C 1080 640, 960 618, 780 632 C 540 650, 260 618, 0 640 Z" fill="#9aa0bd" opacity="0.18" filter="url(#haze)"/>

  <!-- 揃えて置かれた靴 -->
  <g transform="translate(540 670)">
    <ellipse cx="0" cy="36" rx="96" ry="10" fill="#141118" opacity="0.5" filter="url(#haze)"/>
    <path d="M-66 30 C -70 4, -58 -8, -36 -6 C -22 -4, -18 8, -6 12 C 2 16, 6 24, 2 32 Z" fill="#d9cfc4"/>
    <path d="M10 30 C 6 4, 18 -8, 40 -6 C 54 -4, 58 8, 70 12 C 78 16, 82 24, 78 32 Z" fill="#d9cfc4"/>
    <path d="M-58 8 C -52 0, -42 -2, -34 2" stroke="#8a7f78" stroke-width="3" fill="none"/>
    <path d="M18 8 C 24 0, 34 -2, 42 2" stroke="#8a7f78" stroke-width="3" fill="none"/>
  </g>

  <rect width="1200" height="800" filter="url(#grain)" opacity="0.08"/>
</svg>
